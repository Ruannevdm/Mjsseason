<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MJ’s Boerdery – Season Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF1E6;--card:#FBFCF7;--ink:#1D2B1A;--mute:#5E6B58;--line:#D3DAC6;--field:#3C6A38;--nut:#D98A1F;--bad:#B3392B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
header{background:var(--field);color:#fff;padding:14px 16px}
header h1{margin:0 0 10px;font-size:20px;font-weight:800;letter-spacing:.2px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
select,input,button{font:inherit;color:inherit}
select,input{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px;min-width:0}
input:disabled,select:disabled{background:#F0F2EA;color:var(--mute)}
button{border:0;border-radius:6px;padding:8px 14px;background:var(--nut);color:#1D1400;font-weight:600;cursor:pointer}
button.alt{background:transparent;border:1px solid currentColor}
button.x{background:none;color:var(--bad);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--nut);outline-offset:1px}
header select{flex:1;min-width:150px}
main{max-width:900px;margin:0 auto;padding:16px}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.sum small{display:block;color:var(--mute);font-size:12px}
.sum b{font-size:18px;font-weight:800}
.neg{color:var(--bad)}.pos{color:var(--field)}
nav{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
nav button{background:none;color:var(--mute);border-radius:6px 6px 0 0;padding:8px 14px;white-space:nowrap}
nav button.on{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-color:var(--card);margin-bottom:-2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:17px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:4px}
td{padding:3px}
td input,td select{width:100%}
td.n input{text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mute)}
label input,label select{display:block;width:100%;margin-top:3px;color:var(--ink)}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;background:var(--line)}
.tag.active{background:#CFE5C9}.tag.closed{background:#E6D3B0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 12px}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
@media(max-width:520px){.sum b{font-size:15px}}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#login form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;width:100%;max-width:340px}
#login h2{margin:0 0 12px}#login input,#login button{width:100%;margin-top:10px}#msg{color:var(--bad);min-height:20px;margin:8px 0 0}
#report{display:none}
@media print{body>*:not(#report){display:none!important}body{background:#fff}#report{display:block;color:#000;font:12px/1.4 system-ui,sans-serif}#report h1{font-size:22px;margin:0;color:#3C6A38}#report h2{font-size:14px;margin:16px 0 4px;border-bottom:2px solid #3C6A38;padding-bottom:2px}#report table{min-width:0;width:100%;border-collapse:collapse}#report th,#report td{padding:4px 6px;border-bottom:1px solid #ccc;text-align:left;color:#000}#report .r{text-align:right}#report tr{break-inside:avoid}@page{margin:14mm}}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px"><h1 style="margin:0">MJ’s Boerdery · Season planner</h1><span style="white-space:nowrap"><small id="status"></small> <button class="alt" style="color:#fff;padding:4px 10px" onclick="logout()">Log out</button></span></div>
  <div class="bar"><select id="pick" aria-label="Season" onchange="ui.sid=this.value;render()"></select><button onclick="ui.newOpen=!ui.newOpen;render()">New season</button></div>
  <div id="newBar" class="bar" style="margin-top:8px;display:none"><input id="newName" placeholder="Season name, e.g. Butternut 2026/27" style="flex:1"><button onclick="addSeason()">Create</button><button class="alt" style="color:#fff" onclick="ui.newOpen=false;render()">Cancel</button></div>
</header>
<div id="login"><form onsubmit="login(event)"><h2>MJ’s Boerdery</h2><label>Email<input id="em" type="email" autocomplete="username" required></label><label>Password<input id="pw" type="password" autocomplete="current-password" required></label><button>Log in</button><p id="msg" role="alert"></p></form></div>
<main id="app"></main>
<div id="report"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://esjakutxywwmaqzqxgue.supabase.co",SB_KEY="sb_publishable_YfLrDMcPV0WCDNRHd6cOZg_bHj6dSwP";
const KEY='mj-boerdery-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const R=n=>'R '+(+n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.seasons)return d}catch(e){}
  return{crops:['Butternut','Maize','Cattle'],cats:['Seed','Fertiliser','Water','Chemicals','Labour','Fuel','Packaging','Transport'],seasons:[]}}
let sb=null,user=null,loaded=false,timer=null;
function setStatus(t,bad){const e=document.getElementById('status');e.textContent=t;e.style.color=bad?'#FFD2CC':'#fff'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
  if(!user||!loaded)return;setStatus('Saving…');clearTimeout(timer);timer=setTimeout(push,600)}
async function push(){const{error}=await sb.from('farm_data').upsert({user_id:user.id,data:db,updated_at:new Date().toISOString()});setStatus(error?'Not saved – check connection':'Saved',!!error)}
let db=load(),ui={sid:db.seasons[0]?.id||null,tab:'costs'};
const cur=()=>db.seasons.find(s=>s.id===ui.sid);
const cost=s=>s.costs.reduce((t,c)=>t+(+c.qty||0)*(+c.price||0),0);
const exp=s=>(s.expenses||[]).reduce((t,e)=>t+(+e.amount||0),0);
const spend=s=>cost(s)+exp(s);
const hasAct=s=>s.actualBoxes!==''&&s.actualPrice!=='';
const net=(s,act)=>{const g=(+(act?s.actualBoxes:s.boxes)||0)*(+(act?s.actualPrice:s.price)||0);return g-g*(+s.commission||0)/100-(+s.transport||0)};
const profit=(s,act)=>net(s,act)-spend(s);
const cls=n=>n<0?'neg':'pos';

function addSeason(){
  const inp=document.getElementById('newName'),name=(inp.value||'').trim();if(!name){inp.focus();return}inp.value='';ui.newOpen=false;
  const s={id:uid(),name,crop:db.crops[0]||'',field:'',status:'planning',costs:[],expenses:[],boxes:0,price:0,commission:0,transport:0,actualBoxes:'',actualPrice:'',nextId:null};
  db.seasons.unshift(s);ui.sid=s.id;ui.tab='costs';save();render();
}
function setS(k,v,num){const s=cur();s[k]=num?(v===''?'':+v):v;save();render()}
function addCost(){cur().costs.push({id:uid(),cat:db.cats[0]||'',item:'',qty:1,unit:'unit',price:0});save();render()}
function setC(id,k,v){const c=cur().costs.find(c=>c.id===id);c[k]=(k==='qty'||k==='price')?+v:v;save();render()}
function delCost(id){const s=cur();s.costs=s.costs.filter(c=>c.id!==id);save();render()}
function toggleClose(){const s=cur();s.status=s.status==='closed'?'active':'closed';save();render()}
function planNext(){
  const s=cur(),name=s.name+' (next)';
  const n={...s,id:uid(),name,status:'planning',costs:s.costs.map(c=>({...c,id:uid()})),expenses:(s.expenses||[]).map(e=>({...e,id:uid()})),actualBoxes:'',actualPrice:'',nextId:null};
  db.seasons.unshift(n);s.nextId=n.id;ui.sid=n.id;ui.tab='costs';save();render();
}
function addList(k){const i=document.getElementById('new-'+k),v=i.value.trim();if(v&&!db[k].includes(v)){db[k].push(v);save();render()}}
function delList(k,v){db[k]=db[k].filter(x=>x!==v);save();render()}
function addExp(){const s=cur();(s.expenses=s.expenses||[]).push({id:uid(),date:new Date().toISOString().slice(0,10),desc:'',cat:'',amount:0});save();render()}
function setE(id,k,v){const e=cur().expenses.find(e=>e.id===id);e[k]=k==='amount'?+v:v;save();render()}
function delExp(id){const s=cur();s.expenses=s.expenses.filter(e=>e.id!==id);save();render()}
function expTab(s,d){const L=s.expenses||[];
  return`<div class="panel"><h2>Other expenses</h2><p style="margin-top:0;color:var(--mute)">Sundry costs not tied to this crop’s inputs, such as repairs, insurance, admin or vehicle costs.</p><div class="scroll"><table><thead><tr><th>Date<th>Description<th>Category<th>Amount (R)<th></tr></thead><tbody>
  ${L.map(e=>`<tr><td><input ${d} type="date" value="${esc(e.date)}" onchange="setE('${e.id}','date',this.value)">
  <td><input ${d} value="${esc(e.desc)}" placeholder="e.g. Tractor repair" onchange="setE('${e.id}','desc',this.value)">
  <td><input ${d} value="${esc(e.cat)}" placeholder="e.g. Repairs" onchange="setE('${e.id}','cat',this.value)">
  <td class="n"><input ${d} type="number" step="any" value="${e.amount}" onchange="setE('${e.id}','amount',this.value)">
  <td>${d?'':`<button class="x" aria-label="Remove expense" onclick="delExp('${e.id}')">✕</button>`}</tr>`).join('')}
  </tbody></table></div>${L.length?'':'<p class="empty">No other expenses yet.</p>'}${d?'':'<button onclick="addExp()">Add expense</button>'}
  <div class="row" style="margin-top:10px"><span>Total other expenses</span><b>${R(exp(s))}</b></div></div>`}
function report(){
  const s=cur(),L=s.expenses||[],kv=(a,v)=>`<tr><td>${a}</td><td class="r">${v}</td></tr>`,sp=(+s.budget||0)-spend(s);
  document.getElementById('report').innerHTML=`<h1>MJ’s Boerdery</h1><div><b>Season report: ${esc(s.name)}</b></div><div>${esc(s.crop)}${s.field?' · '+esc(s.field):''} · ${s.status} · ${new Date().toLocaleDateString('en-ZA')}</div>
  <h2>Summary</h2><table>${kv('Starting budget',R(s.budget))}${kv('Input costs',R(cost(s)))}${kv('Other expenses',R(exp(s)))}${kv('Total spend',R(spend(s)))}${kv('Budget left',R(sp))}${kv('Expected profit',R(profit(s)))}${hasAct(s)?kv('Actual profit',R(profit(s,1))):''}${+s.boxes?kv('Break-even price per box',R(spend(s)/+s.boxes)):''}</table>
  <h2>Input costs</h2><table><tr><th>Category</th><th>Item</th><th class="r">Qty</th><th>Unit</th><th class="r">Price</th><th class="r">Total</th></tr>${s.costs.map(c=>`<tr><td>${esc(c.cat)}</td><td>${esc(c.item)}</td><td class="r">${c.qty}</td><td>${esc(c.unit)}</td><td class="r">${R(c.price)}</td><td class="r">${R((+c.qty||0)*(+c.price||0))}</td></tr>`).join('')}<tr><th colspan="5">Total input costs</th><th class="r">${R(cost(s))}</th></tr></table>
  <h2>Other expenses</h2><table><tr><th>Date</th><th>Description</th><th>Category</th><th class="r">Amount</th></tr>${L.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.desc)}</td><td>${esc(e.cat)}</td><td class="r">${R(e.amount)}</td></tr>`).join('')}<tr><th colspan="3">Total other expenses</th><th class="r">${R(exp(s))}</th></tr></table>
  <h2>Returns</h2><table>${kv('Expected boxes',s.boxes||0)}${kv('Agreed price per box',R(s.price))}${kv('Market commission',(s.commission||0)+'%')}${kv('Transport & fees',R(s.transport))}${kv('Expected net revenue',R(net(s)))}${hasAct(s)?kv('Actual boxes sold',s.actualBoxes)+kv('Final price per box',R(s.actualPrice))+kv('Actual net revenue',R(net(s,1))):''}</table>`;
  window.print();
}
function csv(){
  const s=cur(),q=v=>{v=String(v??'');return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},n2=v=>(+v||0).toFixed(2),rows=[];
  rows.push(['MJ’s Boerdery: season report'],['Season',s.name],['Crop',s.crop],['Field',s.field],['Status',s.status],['Generated',new Date().toLocaleDateString('en-ZA')],[]);
  rows.push(['SUMMARY'],['Starting budget',n2(s.budget)],['Input costs',n2(cost(s))],['Other expenses',n2(exp(s))],['Total spend',n2(spend(s))],['Budget left',n2((+s.budget||0)-spend(s))],[]);
  rows.push(['INPUT COSTS'],['Category','Item','Qty','Unit','Unit price','Line total']);
  s.costs.forEach(c=>rows.push([c.cat,c.item,c.qty,c.unit,n2(c.price),n2((+c.qty||0)*(+c.price||0))]));
  rows.push([],['OTHER EXPENSES'],['Date','Description','Category','Amount']);
  (s.expenses||[]).forEach(e=>rows.push([e.date,e.desc,e.cat,n2(e.amount)]));
  rows.push([],['RETURNS'],['Expected boxes',s.boxes||0],['Agreed price per box',n2(s.price)],['Market commission %',s.commission||0],['Transport & fees',n2(s.transport)],['Expected net revenue',n2(net(s))],['Expected profit',n2(profit(s))]);
  if(hasAct(s))rows.push(['Actual boxes',s.actualBoxes],['Actual price per box',n2(s.actualPrice)],['Actual net revenue',n2(net(s,1))],['Actual profit',n2(profit(s,1))]);
  const blob=new Blob(['\ufeffsep=,\n'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=s.name.replace(/[^\w-]+/g,'_')+'.csv';a.click();
}

function costsTab(s,d){
  const cats={};s.costs.forEach(c=>cats[c.cat]=(cats[c.cat]||0)+(+c.qty||0)*(+c.price||0));
  return`<div class="panel"><h2>Input costs</h2><div class="scroll"><table><thead><tr><th>Category<th>Item<th>Qty<th>Unit<th>Price (R)<th>Total<th></tr></thead><tbody>
  ${s.costs.map(c=>`<tr><td><select ${d} onchange="setC('${c.id}','cat',this.value)">${[...new Set([...db.cats,c.cat])].map(x=>`<option ${x===c.cat?'selected':''}>${esc(x)}</option>`).join('')}</select>
  <td><input ${d} value="${esc(c.item)}" placeholder="e.g. Hybrid seed" onchange="setC('${c.id}','item',this.value)">
  <td class="n"><input ${d} type="number" step="any" value="${c.qty}" onchange="setC('${c.id}','qty',this.value)">
  <td><input ${d} value="${esc(c.unit)}" onchange="setC('${c.id}','unit',this.value)">
  <td class="n"><input ${d} type="number" step="any" value="${c.price}" onchange="setC('${c.id}','price',this.value)">
  <td style="white-space:nowrap">${R((+c.qty||0)*(+c.price||0))}<td>${d?'':`<button class="x" aria-label="Remove cost" onclick="delCost('${c.id}')">✕</button>`}</tr>`).join('')}
  </tbody></table></div>${s.costs.length?'':'<p class="empty">No costs yet. Add seed, fertiliser, water and the rest.</p>'}
  ${d?'':'<button onclick="addCost()">Add cost</button>'}</div>
  <div class="panel"><h2>By category</h2>${Object.entries(cats).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${R(v)}</b></div>`).join('')||'<span class="empty">Nothing yet</span>'}</div>`;
}
function returnsTab(s,d){
  const f=(l,k,num=1,step='any')=>`<label>${l}<input ${d} type="number" step="${step}" value="${s[k]}" onchange="setS('${k}',this.value,1)"></label>`;
  return`<div class="panel"><h2>Expected returns (agreed with the market)</h2><div class="grid">${f('Boxes sent','boxes')}${f('Agreed price per box (R)','price')}${f('Market commission (%)','commission')}${f('Transport & other fees (R, total)','transport')}</div>
  <div class="row" style="margin-top:10px"><span>Expected net revenue</span><b>${R(net(s))}</b></div><div class="row"><span>Expected profit</span><b class="${cls(profit(s))}">${R(profit(s))}</b></div></div>
  <div class="panel"><h2>Actual payout</h2><p style="margin-top:0;color:var(--mute)">Fill in when the market pays out. It replaces the estimate in the totals.</p><div class="grid">${f('Boxes sold','actualBoxes')}${f('Final price per box (R)','actualPrice')}</div>
  ${hasAct(s)?`<div class="row" style="margin-top:10px"><span>Actual profit</span><b class="${cls(profit(s,1))}">${R(profit(s,1))}</b></div><div class="row"><span>Difference to expected</span><b class="${cls(profit(s,1)-profit(s))}">${R(profit(s,1)-profit(s))}</b></div>`:''}</div>`;
}
function nextTab(s){
  const n=db.seasons.find(x=>x.id===s.nextId),p=hasAct(s)?profit(s,1):profit(s);
  if(!n)return`<div class="panel"><h2>Plan the next cycle</h2><p>Copy this season’s costs into a new season. Edit quantities and prices there, and see whether this season’s profit covers it.</p><button onclick="planNext()">Create next season from this one</button></div>`;
  const left=p-spend(n);
  return`<div class="panel"><h2>Next cycle: ${esc(n.name)}</h2>
  <div class="row"><span>This season’s profit (${hasAct(s)?'actual':'expected'})</span><b class="${cls(p)}">${R(p)}</b></div>
  <div class="row"><span>Planned costs for next season</span><b>${R(spend(n))}</b></div>
  <div class="row"><span>${left<0?'Shortfall to fund':'Left over after next season’s inputs'}</span><b class="${cls(left)}">${R(Math.abs(left))}</b></div>
  <p><button class="alt" style="color:var(--field)" onclick="ui.sid='${n.id}';ui.tab='costs';render()">Edit next season’s costs</button></p></div>`;
}
function setTab(){
  const chips=k=>`<div class="chips">${db[k].map(v=>`<span>${esc(v)} <button class="x" aria-label="Remove ${esc(v)}" onclick="delList('${k}',this.dataset.v)" data-v="${esc(v)}">✕</button></span>`).join('')}</div>
  <div class="bar"><input id="new-${k}" placeholder="Add new"><button onclick="addList('${k}')">Add</button></div>`;
  return`<div class="panel"><h2>Crops and enterprises</h2>${chips('crops')}</div><div class="panel"><h2>Cost categories</h2>${chips('cats')}</div>
  <p style="color:var(--mute)">Data is saved online to the farm’s account. Export a PDF or CSV report from each season to keep a copy.</p>`;
}
function render(){
  const pick=document.getElementById('pick');document.getElementById('newBar').style.display=ui.newOpen?'flex':'none';if(ui.newOpen)setTimeout(()=>document.getElementById('newName').focus(),0);
  pick.innerHTML=db.seasons.map(s=>`<option value="${s.id}" ${s.id===ui.sid?'selected':''}>${esc(s.name)}</option>`).join('')||'<option>No seasons yet</option>';
  const s=cur(),app=document.getElementById('app');
  if(!s){app.innerHTML=`<div class="empty"><p>No seasons yet. Start your first butternut season.</p><button onclick="ui.newOpen=true;render()">New season</button></div><div id="cfg">${setTab()}</div>`;return}
  const d=s.status==='closed'?'disabled':'',p=hasAct(s)?profit(s,1):profit(s),b=+s.boxes||0;
  const tabs=[['costs','Costs'],['expenses','Expenses'],['returns','Returns'],['next','Next cycle'],['set','Settings']];
  app.innerHTML=`<div class="bar" style="margin-bottom:12px;align-items:end">
  <label style="flex:1;min-width:140px">Crop<select ${d} onchange="setS('crop',this.value)">${[...new Set([...db.crops,s.crop])].map(c=>`<option ${c===s.crop?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
  <label style="flex:1;min-width:140px">Field(s)<input ${d} value="${esc(s.field)}" placeholder="e.g. Camp 3, 12 ha" onchange="setS('field',this.value)"></label>
  <label style="flex:1;min-width:140px">Starting budget (R)<input ${d} type="number" step="any" value="${s.budget??''}" placeholder="e.g. 700000" onchange="setS('budget',this.value,1)"></label><span class="tag ${s.status}">${s.status}</span></div>
  <div class="sum"><div><small>Total spend</small><b>${R(spend(s))}</b></div><div><small>Budget left</small><b class="${cls((+s.budget||0)-spend(s))}">${R((+s.budget||0)-spend(s))}</b></div><div><small>${hasAct(s)?'Actual':'Expected'} profit</small><b class="${cls(p)}">${R(p)}</b></div><div><small>Break-even per box</small><b>${b?R(spend(s)/b):'–'}</b></div></div>
  <nav>${tabs.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" onclick="ui.tab='${k}';render()">${l}</button>`).join('')}</nav>
  ${ui.tab==='costs'?costsTab(s,d):ui.tab==='expenses'?expTab(s,d):ui.tab==='returns'?returnsTab(s,d):ui.tab==='next'?nextTab(s):setTab()}
  <div class="bar"><button onclick="report()">Export PDF report</button><button class="alt" style="color:var(--field)" onclick="csv()">Export CSV</button><button class="alt" style="color:var(--field)" onclick="toggleClose()">${s.status==='closed'?'Reopen season':'Close season'}</button></div>`;
}
const loginEl=()=>document.getElementById('login');
async function pull(){
  loginEl().style.display='none';setStatus('Loading…');
  const{data,error}=await sb.from('farm_data').select('data').eq('user_id',user.id).maybeSingle();
  if(error){setStatus('Could not load – refresh',true);return}
  if(data&&data.data&&data.data.seasons)db=data.data;
  loaded=true;if(!(data&&data.data&&data.data.seasons))await push();else setStatus('Saved');
  ui.sid=db.seasons[0]?.id||null;render();
}
async function login(e){e.preventDefault();const m=document.getElementById('msg');m.textContent='';
  const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
  if(error){m.textContent=error.message;return}
  user=data.user;document.getElementById('pw').value='';pull()}
async function logout(){await sb.auth.signOut();user=null;loaded=false;loginEl().style.display='flex'}
async function start(){
  if(typeof supabase==='undefined'){loginEl().style.display='flex';document.getElementById('msg').textContent='Could not load. Check your connection.';return}
  sb=supabase.createClient(SB_URL,SB_KEY);
  const{data:{session}}=await sb.auth.getSession();
  if(session){user=session.user;pull()}else loginEl().style.display='flex';
}
start();
</script>
</body>
